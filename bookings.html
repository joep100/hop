<!DOCTYPE html>
<html lang="en-IE"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>hop &mdash; your bookings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FFCC00;--ink:#17191b;--body:#4a4a4a;--mute:#6e6e6e;--line:rgba(23,25,27,.12);
 --mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--yellow);color:var(--ink);
 font-family:"Inter",system-ui,-apple-system,sans-serif;font-size:16.5px;line-height:1.65;
 -webkit-font-smoothing:antialiased;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,b,strong,.btn,.n{font-family:"Nunito",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:26px 22px 70px}
a{color:inherit}

.hat{display:-webkit-box;display:flex;align-items:center;justify-content:space-between;
 gap:14px;margin-bottom:22px}
.hat img{height:46px;width:auto;display:block}
.hat .out{font-size:13.5px;font-weight:800;color:var(--ink);text-decoration:none;
 border:1px solid rgba(23,25,27,.3);border-radius:9px;padding:8px 14px;background:transparent}
.hat .out:hover{background:var(--ink);color:var(--yellow)}

h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:0 0 6px}
.sub{font-size:17px;color:#3a3d33;margin:0 0 24px}

/* sign in */
.gate{background:#fff;border-radius:18px;padding:30px 30px 26px;max-width:420px}
.gate h2{font-size:21px;font-weight:800;margin:0 0 6px}
.gate p{font-size:15px;color:var(--mute);margin:0 0 18px}
label{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;
 font-weight:700;color:var(--mute);margin-bottom:6px;font-family:var(--mono)}
input,select{width:100%;border:1.5px solid #d8d4ce;border-radius:11px;padding:13px 14px;
 font:inherit;font-size:17px;color:var(--ink);background:#fff;margin-bottom:16px}
input:focus,select:focus{outline:0;border-color:var(--ink)}
#code{font-family:var(--mono);letter-spacing:.12em;font-size:22px}
.btn{width:100%;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:15px;
 font-size:17px;font-weight:800;cursor:pointer}
.btn:hover{background:#000}
.err{color:#A32D2D;font-size:15px;margin:12px 0 0;display:none}
.err.on{display:block}

/* totals */
.sums{display:-webkit-box;display:flex;flex-wrap:wrap;margin:0 -6px 20px}
.sum{flex:1 1 150px;margin:0 6px 12px;background:#fff;border-radius:14px;padding:18px 20px}
.sum b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sum span{display:block;font-size:13.5px;color:var(--mute);margin-top:3px}

/* the list */
.filters{display:-webkit-box;display:flex;align-items:center;margin:0 0 14px}
.filters select{width:auto;margin:0 10px 0 0;padding:9px 12px;font-size:15px;border-radius:9px}
.count{font-size:14.5px;color:#3a3d33}

.row{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:9px;
 display:-webkit-box;display:flex;align-items:flex-start}
.row__m{flex:1;min-width:0}
.row__r{flex:none;text-align:right;padding-left:16px}
.row .ref{font-family:var(--mono);font-size:13px;color:var(--mute);letter-spacing:.06em}
.row .who{font-size:17px;font-weight:800;margin:2px 0 2px}
.row .addr{font-size:14.5px;color:var(--body);line-height:1.45}
.row .fee{font-size:17px;font-weight:800;white-space:nowrap}
.row .when{font-size:13px;color:var(--mute);margin-top:3px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;
 text-transform:uppercase;border-radius:100px;padding:3px 9px;margin-top:6px;
 background:#f3efe6;color:#8a5a00}

.empty{background:#fff;border-radius:14px;padding:30px;text-align:center;color:var(--mute)}
.load{text-align:center;color:#3a3d33;padding:26px}
.foot{margin-top:26px;font-size:13.5px;color:#3a3d33;line-height:1.6}
.foot a{font-weight:800}
@media(max-width:560px){
  .row{display:block}.row__r{text-align:left;padding:8px 0 0}
  .row .when{display:inline;margin-left:10px}
}
</style></head><body><div class="wrap">

    <option>Foleys Chemist</option>
  </select>
  <label for="code">Your code</label>
  <input id="code" inputmode="numeric" maxlength="6" autocomplete="off">
  <button class="btn" id="go">See my bookings</button>
  <p class="err" id="err"></p>
</div>

<div id="app" hidden>
  <div class="sums" id="sums"></div>
  <div class="filters">
    <select id="period">
      <option value="30">Last 30 days</option>
      <option value="7">Last 7 days</option>
      <option value="0">Everything</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
  <p class="foot">Prices shown are what hop charges you, before VAT. Anything you need changed
  or cancelled, ring <b>01 425 5722</b> &mdash; we would rather you rang than wondered.</p>
</div>

<div class="load" id="load" hidden>Fetching your bookings&hellip;</div>

</div>
<script>
(function(){
  /* The sheet filters before anything leaves Google: the script checks the shop
     and code together and returns only that shop's rows. Nothing about any other
     shop's customers is ever sent to this page. */
  var FEED = "https://script.google.com/macros/s/AKfycby4fu6L59kRmlFnOA5Eti1DHufP54XhBFh3eUWQMDiDGbMThrSG7u1EtBEu2nOlN3ZF/exec";
  var $ = function(id){ return document.getElementById(id); };
  var rows = [], shop = "";

  function fail(m){ var e = $("err"); e.textContent = m; e.className = "err on"; }

  function money(v){
    var n = parseFloat(String(v).replace(/[^0-9.]/g, ""));
    return isFinite(n) ? "\u20ac" + n.toFixed(2) : "";
  }
  function when(v){
    var d = new Date(v);
    if (isNaN(d)) return String(v || "");
    var day = d.toLocaleDateString("en-IE", { day:"numeric", month:"short" });
    var tm  = d.toLocaleTimeString("en-IE", { hour:"2-digit", minute:"2-digit", hour12:false });
    return day + ", " + tm;
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
  }

  function load(s, c){
    $("gate").hidden = true; $("load").hidden = false;
    fetch(FEED + "?shop=" + encodeURIComponent(s) + "&code=" + encodeURIComponent(c))
      .then(function(r){ return r.json(); })
      .then(function(d){
        $("load").hidden = true;
        if (!d || !d.ok) {
          $("gate").hidden = false;
          fail("That shop and code do not match. Try again, or ring 01 425 5722.");
          return;
        }
        shop = s; rows = d.rows || [];
        try { sessionStorage.setItem("hop:bk", JSON.stringify({ s: s, c: c })); } catch(e){}
        $("app").hidden = false; $("out").hidden = false;
        $("sub").textContent = s + " \u00b7 everything you have sent with hop.";
        draw();
      })
      .catch(function(){
        $("load").hidden = true; $("gate").hidden = false;
        fail("Could not reach the list just now. Try again in a moment.");
      });
  }

  function draw(){
    var days = parseInt($("period").value, 10);
    var cut = days ? Date.now() - days * 86400000 : 0;
    var show = rows.filter(function(r){
      if (!days) return true;
      var t = new Date(r.bookedAt).getTime();
      return isNaN(t) ? true : t >= cut;
    });

    var real = show.filter(function(r){ return r.practice !== "practice"; });
    var total = real.reduce(function(a, r){
      var n = parseFloat(String(r.fee).replace(/[^0-9.]/g, ""));
      return a + (isFinite(n) ? n : 0);
    }, 0);

    $("sums").innerHTML =
      '<div class="sum"><b>' + real.length + '</b><span>deliveries</span></div>' +
      '<div class="sum"><b>' + money(total) + '</b><span>before VAT</span></div>' +
      '<div class="sum"><b>' + (real.length ? money(total / real.length) : "\u2014") +
        '</b><span>average</span></div>';

    $("count").textContent = show.length
      ? show.length + (show.length === 1 ? " booking" : " bookings")
      : "";

    if (!show.length) {
      $("list").innerHTML = '<div class="empty">Nothing in this period yet.</div>';
      return;
    }

    $("list").innerHTML = show.map(function(r){
      return '<div class="row">' +
        '<div class="row__m">' +
          '<div class="ref">' + esc(r.reference) +
            (r.tracking ? ' &middot; job ' + esc(r.tracking) : '') + '</div>' +
          '<div class="who">' + esc(r.customer || "\u2014") + '</div>' +
          '<div class="addr">' + esc(r.address) + '</div>' +
          (r.practice === "practice" ? '<span class="tag">Practice</span>' : '') +
        '</div>' +
        '<div class="row__r">' +
          '<div class="fee">' + money(r.fee) + '</div>' +
          '<div class="when">' + esc(when(r.bookedAt)) + '</div>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  $("go").addEventListener("click", function(){
    $("err").className = "err";
    var s = $("shop").value, c = $("code").value.trim();
    if (!s) return fail("Choose your shop first.");
    if (!/^\d{6}$/.test(c)) return fail("The code is six digits.");
    load(s, c);
  });
  $("code").addEventListener("keydown", function(e){ if (e.key === "Enter") $("go").click(); });
  $("period").addEventListener("change", draw);
  $("out").addEventListener("click", function(){
    try { sessionStorage.removeItem("hop:bk"); } catch(e){}
    location.reload();
  });

  try {
    var saved = JSON.parse(sessionStorage.getItem("hop:bk") || "null");
    if (saved && saved.s && saved.c) load(saved.s, saved.c);
  } catch(e){}
})();
</script>
</body></html>
